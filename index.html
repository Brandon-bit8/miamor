<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a1420">
<title>Nuestra historia</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='90'>❤️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Parisienne&display=swap" rel="stylesheet">
<style>
  :root{
    --papel: #f7f0e3;
    --papel-sombra: #e9dcc3;
    --tinta: #3a2c22;
    --vino: #6d1f34;
    --vino-oscuro: #3a1420;
    --vino-mas-oscuro: #240d15;
    --oro: #c9a961;
    --oro-suave: #e3caa0;
    --salvia: #8a9a7c;
    --curva: cubic-bezier(.62,.05,.4,1);
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    background:var(--vino-mas-oscuro);
    overflow:hidden;
    font-family:"EB Garamond", serif;
    color:var(--tinta);
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- fondo ---------- */
  .fondo{
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(60% 50% at 50% 38%, rgba(201,169,97,.14), transparent 70%),
      radial-gradient(120% 90% at 50% 100%, var(--vino-oscuro), var(--vino-mas-oscuro) 60%);
  }
  .particulas{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; }
  .particulas i{
    position:absolute;
    bottom:-10%;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--oro-suave);
    opacity:0;
    filter:blur(.5px);
    animation:flotar 9s ease-in infinite;
  }
  .particulas i:nth-child(1){ left:10%; animation-delay:.2s; }
  .particulas i:nth-child(2){ left:22%; animation-delay:2.4s; width:3px; height:3px; }
  .particulas i:nth-child(3){ left:38%; animation-delay:4.6s; }
  .particulas i:nth-child(4){ left:55%; animation-delay:1.1s; width:4px; height:4px; }
  .particulas i:nth-child(5){ left:68%; animation-delay:3.8s; }
  .particulas i:nth-child(6){ left:80%; animation-delay:.9s; width:3px; height:3px; }
  .particulas i:nth-child(7){ left:90%; animation-delay:5.5s; }
  .particulas i:nth-child(8){ left:47%; animation-delay:6.6s; width:3px; height:3px; }
  @keyframes flotar{
    0%{ transform:translateY(0) scale(.6); opacity:0; }
    12%{ opacity:.55; }
    85%{ opacity:.35; }
    100%{ transform:translateY(-100vh) scale(1); opacity:0; }
  }

  /* ---------- escena ---------- */
  .escena{
    position:relative;
    height:100%; height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.1rem;
    padding:1.5rem 1rem;
  }

  .cinta{
    position:absolute;
    top:0; left:64%;
    width:34px; height:120px;
    background:linear-gradient(var(--vino), var(--vino-oscuro));
    clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);
    box-shadow:0 6px 14px rgba(0,0,0,.35);
    z-index:1;
  }

  .libro{
    position:relative;
    width:min(90vw, 380px);
    aspect-ratio: 3 / 4.3;
    max-height:66dvh;
    perspective:1900px;
  }

  .grosor{
    position:absolute;
    right:-4px; top:6px; bottom:6px; width:8px;
    background:repeating-linear-gradient(to bottom, var(--papel) 0 2px, var(--papel-sombra) 2px 4px);
    border-radius:0 3px 3px 0;
    box-shadow:2px 0 8px rgba(0,0,0,.35);
    z-index:0;
  }

  .pila-paginas{ position:relative; width:100%; height:100%; z-index:1; }

  .pagina{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    background:var(--papel);
    background-image:repeating-linear-gradient(125deg, rgba(0,0,0,.015) 0 1px, transparent 1px 3px);
    border-radius:3px 12px 12px 3px;
    box-shadow:0 18px 40px rgba(0,0,0,.4), inset -1px 0 0 rgba(0,0,0,.06);
    padding:2.1rem 1.6rem 1.6rem;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    transform-origin:left center;
    transition:transform .95s var(--curva);
    overflow:hidden;
  }
  .pagina::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:14px;
    background:linear-gradient(to right, rgba(0,0,0,.28), transparent);
    pointer-events:none;
  }
  .pagina.volteada{ transform:rotateY(-180deg); }

  .num-pagina{
    position:absolute; bottom:.9rem; right:1.2rem;
    font-family:"Parisienne", cursive;
    font-size:1.15rem;
    color:var(--vino);
    opacity:.55;
  }

  .divisor{ display:flex; align-items:center; gap:.6rem; margin:.5rem 0 1.15rem; }
  .divisor span{ flex:1; height:1px; background:var(--oro); opacity:.55; }
  .divisor i{ font-style:normal; color:var(--oro); font-size:.85rem; opacity:.85; }
  .divisor.claro span{ background:var(--oro-suave); opacity:.7; }
  .divisor.claro i{ color:var(--oro-suave); }

  /* ---------- portada ---------- */
  .pagina-portada{
    align-items:center; justify-content:center; text-align:center;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(201,169,97,.12), transparent 60%),
      linear-gradient(155deg, var(--vino) 0%, var(--vino-oscuro) 55%, var(--vino-mas-oscuro) 100%);
    background-image:
      radial-gradient(120% 90% at 50% 0%, rgba(201,169,97,.12), transparent 60%),
      linear-gradient(155deg, var(--vino) 0%, var(--vino-oscuro) 55%, var(--vino-mas-oscuro) 100%);
    color:var(--oro-suave);
    padding:2.2rem 1.7rem;
  }
  .pagina-portada::after{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(227,202,160,.35);
    border-radius:2px 10px 10px 2px;
    pointer-events:none;
  }
  .portada-eyebrow{
    margin:0; font-size:.72rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--oro-suave); opacity:.8;
  }
  .portada-titulo{
    margin:.5rem 0 0; font-family:"Playfair Display", serif; font-weight:900;
    font-size:clamp(2rem, 9vw, 2.9rem); line-height:1.08; color:#fbf3e3;
    text-shadow:0 2px 12px rgba(0,0,0,.35);
  }
  .portada-subtitulo{
    margin:0; font-family:"Parisienne", cursive; font-size:clamp(1.05rem,4.6vw,1.3rem);
    color:var(--oro-suave); opacity:.9;
  }
  .sello{
    appearance:none; border:none; cursor:pointer;
    width:78px; height:78px; border-radius:50%; margin:1.6rem 0 .7rem;
    background:radial-gradient(circle at 35% 30%, #a13a52, var(--vino) 55%, var(--vino-oscuro) 100%);
    box-shadow:0 8px 18px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -6px 10px rgba(0,0,0,.35);
    display:flex; align-items:center; justify-content:center;
    animation:pulso 2.6s ease-in-out infinite;
  }
  .sello-corazon{ color:var(--oro-suave); font-size:1.6rem; transform:translateY(-1px); }
  .sello:focus-visible{ outline:2px solid var(--oro); outline-offset:4px; }
  .sello.rompiendo{ animation:romper .42s var(--curva) forwards; }
  @keyframes pulso{
    0%,100%{ box-shadow:0 8px 18px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -6px 10px rgba(0,0,0,.35), 0 0 0 0 rgba(201,169,97,.35); }
    50%{ box-shadow:0 8px 18px rgba(0,0,0,.45), inset 0 2px 3px rgba(255,255,255,.25), inset 0 -6px 10px rgba(0,0,0,.35), 0 0 0 10px rgba(201,169,97,0); }
  }
  @keyframes romper{
    0%{ transform:scale(1) rotate(0); }
    40%{ transform:scale(1.18) rotate(-6deg); }
    100%{ transform:scale(.3) rotate(12deg); opacity:0; }
  }
  .portada-ayuda{
    margin:0; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase;
    color:var(--oro-suave); opacity:.65;
  }

  /* ---------- páginas de texto ---------- */
  .pagina-texto{ justify-content:flex-start; padding-top:2.4rem; }
  .pagina-texto h2{
    margin:0; font-family:"Playfair Display", serif; font-weight:700;
    font-size:clamp(1.35rem,6.2vw,1.7rem); color:var(--vino-oscuro); line-height:1.2;
  }
  .pagina-texto p{
    margin:0 0 .85rem; font-size:clamp(.98rem,3.7vw,1.05rem); line-height:1.75;
    font-style:italic; color:var(--tinta);
  }

  /* ---------- páginas de foto ---------- */
  .pagina-foto{ align-items:center; justify-content:center; gap:1rem; }
  .foto-marco{
    position:relative;
    width:78%; aspect-ratio:4/5;
    background:#fff;
    padding:10px 10px 30px;
    box-shadow:0 12px 26px rgba(0,0,0,.28);
    transform:rotate(var(--giro,-2deg));
  }
  .foto-marco img{ width:100%; height:100%; object-fit:cover; display:block; background:var(--papel-sombra); }
  .foto-placeholder{
    display:none; width:100%; height:100%;
    flex-direction:column; align-items:center; justify-content:center; gap:.4rem;
    background:var(--papel-sombra);
    border:1.5px dashed var(--oro);
    text-align:center; padding:.8rem;
  }
  .foto-marco.sin-foto .foto-placeholder{ display:flex; }
  .foto-placeholder svg{ width:30px; height:30px; opacity:.55; }
  .foto-placeholder span{ font-size:.85rem; color:var(--vino); font-weight:600; }
  .foto-placeholder small{ font-size:.72rem; color:var(--vino); opacity:.6; font-family:monospace; }
  .pie-foto{
    margin:0; font-family:"Parisienne", cursive; font-size:1.15rem;
    color:var(--vino-oscuro); text-align:center; transform:rotate(var(--giro,-2deg));
  }

  /* ---------- lista ---------- */
  .pagina-lista{ justify-content:flex-start; padding-top:2.4rem; }
  .pagina-lista h2{
    margin:0; font-family:"Playfair Display", serif; font-weight:700;
    font-size:clamp(1.35rem,6.2vw,1.7rem); color:var(--vino-oscuro);
  }
  .lista-amor{ list-style:none; margin:0; padding:0; overflow-y:auto; }
  .lista-amor li{
    position:relative; padding-left:1.4rem; margin-bottom:.65rem;
    font-size:clamp(.95rem,3.6vw,1.02rem); line-height:1.55; font-style:italic;
  }
  .lista-amor li::before{
    content:"❀"; position:absolute; left:0; top:.05rem;
    color:var(--oro); font-style:normal; font-size:.85rem;
  }

  /* ---------- página final ---------- */
  .pagina-final{ align-items:center; justify-content:center; text-align:center; gap:.6rem; }
  .final-mensaje{
    margin:0; font-family:"Parisienne", cursive; color:var(--vino-oscuro);
    font-size:clamp(1.55rem,7.4vw,2.1rem); line-height:1.35;
  }
  .final-firma{
    margin:.6rem 0 0; font-family:"EB Garamond", serif; font-style:italic;
    font-size:.95rem; color:var(--vino); letter-spacing:.04em;
  }

  /* ---------- controles ---------- */
  .controles{
    display:flex; align-items:center; justify-content:center; gap:1rem;
    color:var(--oro-suave);
  }
  .controles button{
    appearance:none; width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(227,202,160,.5); background:rgba(255,255,255,.04);
    color:var(--oro-suave); font-size:1.2rem; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .2s, transform .2s;
  }
  .controles button:disabled{ opacity:.25; cursor:default; }
  .controles button:not(:disabled):active{ transform:scale(.92); }
  .controles button:focus-visible{ outline:2px solid var(--oro); outline-offset:3px; }
  .progreso{
    font-size:.75rem; letter-spacing:.14em; text-transform:uppercase;
    min-width:11rem; text-align:center; opacity:.85;
  }

  @media (prefers-reduced-motion: reduce){
    .pagina{ transition:transform .01s linear; }
    .sello{ animation:none; }
    .particulas i{ animation:none; opacity:0; }
  }
</style>
</head>
<body>

  <div class="fondo" aria-hidden="true"></div>
  <div class="particulas" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <main class="escena">
    <div class="cinta" aria-hidden="true"></div>

    <div class="libro" id="libro">
      <div class="grosor" aria-hidden="true"></div>
      <div class="pila-paginas" id="pilaPaginas"></div>
    </div>

    <nav class="controles" aria-label="Navegación del libro">
      <button type="button" id="btnAnterior" aria-label="Página anterior">‹</button>
      <span class="progreso" id="progreso">Toca el sello para comenzar</span>
      <button type="button" id="btnSiguiente" aria-label="Página siguiente">›</button>
    </nav>
  </main>

<script>

const miNombre = "tu mugroso";
const suNombre = "EL AMOR DE MI VIDA";

const paginas = [
  {
    tipo: "texto",
    titulo: "Cómo empezó todo",
    texto: "Aun recuerdo ese dia en el que te vi por primera vez sin imaginar que momentos mas tarde ibamos a tener nuestro primero momento de comunicacion y te juro que por mi cabeza nunca paso en que a partir de ese momento estaba conociendo a quien hoy esta siendo el amor de mi vida \n\n Pero lamentablemente un dia la vida nos quiso separar... y de nuevo como el primer dia, paso algo que de nuevo no esperaba que fuera a pasar..."
  },
  {
    tipo: "foto",
    imagen: "fotos/foto1.jpeg",
    pie: "Nuestra primera foto juntos"
  },
    {
    tipo: "final",
    mensaje: "Te amo con todo mi corazón",
    firma: miNombre
  }

];

/* =========================================================================
   A partir de aquí es el motor del libro. No hace falta que edites esto,
   pero si sabes de código, siéntete libre de ajustarlo a tu gusto.
   ========================================================================= */

function numeroRomano(num){
  const valores = [[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];
  let res = "";
  for (const [v, s] of valores){ while (num >= v){ res += s; num -= v; } }
  return res;
}

const iconoCamara = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>`;

function divisor(clase){
  return `<div class="divisor ${clase || ""}" aria-hidden="true"><span></span><i>❀</i><span></span></div>`;
}

function crearPortada(){
  const el = document.createElement("div");
  el.className = "pagina pagina-portada";
  el.innerHTML = `
    <p class="portada-eyebrow">Un libro para</p>
    <h1 class="portada-titulo">${suNombre}</h1>
    ${divisor("claro")}
    <p class="portada-subtitulo">escrito con cariño por ${miNombre}</p>
    <button type="button" class="sello" id="sello" aria-label="Toca para abrir el libro">
      <span class="sello-corazon" aria-hidden="true">♥</span>
    </button>
    <p class="portada-ayuda">toca el sello para abrir</p>
  `;
  return el;
}

function crearPagina(p, indice){
  const el = document.createElement("div");
  const numero = `<span class="num-pagina" aria-hidden="true">${numeroRomano(indice)}</span>`;

  if (p.tipo === "texto"){
    el.className = "pagina pagina-texto";
    const parrafos = p.texto.split("\n\n").map(t => `<p>${t}</p>`).join("");
    el.innerHTML = `${numero}<h2>${p.titulo}</h2>${divisor()}${parrafos}`;
  }
  else if (p.tipo === "foto"){
    el.className = "pagina pagina-foto";
    const giro = indice % 2 === 0 ? "-3deg" : "2deg";
    el.innerHTML = `
      ${numero}
      <div class="foto-marco" style="--giro:${giro}">
        <img src="${p.imagen}" alt="${p.pie}" loading="lazy"
             onerror="this.closest('.foto-marco').classList.add('sin-foto'); this.remove();">
        <div class="foto-placeholder" aria-hidden="true">
          ${iconoCamara}
          <span>Agrega tu foto aquí</span>
          <small>${p.imagen}</small>
        </div>
      </div>
      <p class="pie-foto" style="--giro:${giro}">${p.pie}</p>
    `;
  }
  else if (p.tipo === "lista"){
    el.className = "pagina pagina-lista";
    const items = p.items.map(i => `<li>${i}</li>`).join("");
    el.innerHTML = `${numero}<h2>${p.titulo}</h2>${divisor()}<ul class="lista-amor">${items}</ul>`;
  }
  else if (p.tipo === "final"){
    el.className = "pagina pagina-final";
    el.innerHTML = `${divisor()}<p class="final-mensaje">${p.mensaje}</p><p class="final-firma">— ${p.firma}</p>`;
  }
  return el;
}

/* ---------- render ---------- */
const pila = document.getElementById("pilaPaginas");
const elementos = [crearPortada(), ...paginas.map((p, i) => crearPagina(p, i + 1))];
elementos.forEach(el => { el.style.display = "none"; pila.appendChild(el); });
elementos[0].style.display = "flex";

const total = elementos.length;
let actual = 0;
let animando = false;

const progresoEl = document.getElementById("progreso");
const btnAnterior = document.getElementById("btnAnterior");
const btnSiguiente = document.getElementById("btnSiguiente");
const libroEl = document.getElementById("libro");

function actualizarControles(){
  const totalContenido = total - 1;
  progresoEl.textContent = actual === 0
    ? "Toca el sello para comenzar"
    : `Página ${actual} de ${totalContenido}`;
  btnAnterior.disabled = actual === 0;
  btnSiguiente.disabled = actual === total - 1;
}

function siguiente(){
  if (animando || actual >= total - 1) return;
  animando = true;
  const hojaActual = elementos[actual];
  const hojaSiguiente = elementos[actual + 1];

  hojaSiguiente.style.display = "flex";
  hojaSiguiente.style.zIndex = "1";
  hojaActual.style.zIndex = "2";
  void hojaActual.offsetWidth;
  hojaActual.classList.add("volteada");

  hojaActual.addEventListener("transitionend", function fin(){
    hojaActual.removeEventListener("transitionend", fin);
    hojaActual.style.display = "none";
    hojaActual.classList.remove("volteada");
    hojaActual.style.zIndex = "";
    actual++;
    animando = false;
    actualizarControles();
  }, { once: true });
}

function anterior(){
  if (animando || actual <= 0) return;
  animando = true;
  const hojaActual = elementos[actual];
  const hojaPrevia = elementos[actual - 1];

  hojaPrevia.style.transition = "none";
  hojaPrevia.style.display = "flex";
  hojaPrevia.style.zIndex = "2";
  hojaActual.style.zIndex = "1";
  hojaPrevia.classList.add("volteada");
  void hojaPrevia.offsetWidth;
  hojaPrevia.style.transition = "";

  requestAnimationFrame(() => {
    hojaPrevia.classList.remove("volteada");
  });

  hojaPrevia.addEventListener("transitionend", function fin(){
    hojaPrevia.removeEventListener("transitionend", fin);
    hojaActual.style.display = "none";
    hojaActual.style.zIndex = "";
    hojaPrevia.style.zIndex = "";
    actual--;
    animando = false;
    actualizarControles();
  }, { once: true });
}

document.addEventListener("click", (e) => {
  if (e.target.closest("#sello")){
    const sello = e.target.closest("#sello");
    if (animando) return;
    sello.classList.add("rompiendo");
    sello.setAttribute("aria-disabled", "true");
    setTimeout(siguiente, 380);
  }
});

btnSiguiente.addEventListener("click", siguiente);
btnAnterior.addEventListener("click", anterior);

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") siguiente();
  if (e.key === "ArrowLeft") anterior();
});

let inicioX = 0;
libroEl.addEventListener("touchstart", (e) => {
  inicioX = e.changedTouches[0].clientX;
}, { passive: true });
libroEl.addEventListener("touchend", (e) => {
  const delta = e.changedTouches[0].clientX - inicioX;
  if (Math.abs(delta) < 40) return;
  if (delta < 0) siguiente(); else anterior();
}, { passive: true });

actualizarControles();
</script>
</body>
</html>
